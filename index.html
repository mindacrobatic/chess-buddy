// Longest-prefix match of the game's SAN history against the book.
// `(str + " ").startsWith(...)` covers both the exact line and the line
// being a prefix of the played moves.
function openingInfo() {
  if (!history.length) return null;
  const str = history.map(h => h.san.replace(/[+#]/g, "")).join(" ");
  let best = null, bestLen = 0;
  for (const op of OPENING_BOOK) {
    if (op.moves.length > bestLen && (str + " ").startsWith(op.moves + " ")) {
      bestLen = op.moves.length; best = op;
    }
  }
  return best;
}

function updateSetupMeta() {
  setupMetaEl.textContent = `vs engine · ${LEVELS[levelIdx].name}`;
}

function updateStatus() {
  updateSetupMeta();
  const op = openingInfo();
  openingTagEl.textContent = op ? (op.eco ? op.eco + " · " + op.name : op.name) : "";
  if (thinking) {
    const label = state.turn === "w" ? "White" : "Black";
    statusEl.innerHTML =
      `<span class="turn-dot" style="background:${state.turn === "w" ? "#fff" : "#111"}"></span>` +
      `${label} (engine) thinking<span class="dots"><i></i><i></i><i></i></span>`;
    return;
  }
  if (gameOver) {
    const { result, reason } = gameOver;
    const msg = result === "draw"
      ? `Draw<span class="badge draw">${reason}</span>`
      : `${result === "w" ? "White" : "Black"} wins!<span class="badge mate">${reason}</span>`;
    statusEl.innerHTML = msg;
    return;
  }
  const checked = inCheck(state, state.turn);
  const label = state.turn === "w" ? "White" : "Black";
  statusEl.innerHTML =
    `<span class="turn-dot" style="background:${state.turn === "w" ? "#fff" : "#111"}"></span>` +
    `${label} to move` +
    (checked ? `<span class="badge check">CHECK</span>` : "");
}

function render() {
  const legal = gameOver ? [] : legalMoves(state);
  const checkedKing = !gameOver && inCheck(state, state.turn)
    ? findKing(state.board, state.turn) : null;
  const lastMove = history.length ? history[history.length - 1].snap.move : null;

  boardEl.innerHTML = "";
  for (let vr = 0; vr < 8; vr++) {
    for (let vc = 0; vc < 8; vc++) {
      const br = flipped ? 7 - vr : vr;
      const bc = flipped ? 7 - vc : vc;

      const cell = document.createElement("div");
      cell.className = "square " + ((br + bc) % 2 === 0 ? "light" : "dark");
      cell.dataset.r = br; cell.dataset.c = bc;

      if (lastMove && ((lastMove.from[0] === br && lastMove.from[1] === bc) ||
                       (lastMove.to[0] === br && lastMove.to[1] === bc)))
        cell.classList.add("lastmove");
      if (checkedKing && checkedKing[0] === br && checkedKing[1] === bc)
        cell.classList.add("check");
      if (selected && selected[0] === br && selected[1] === bc)
        cell.classList.add("selected");

      const piece = state.board[br][bc];
      if (piece) {
        const el = document.createElement("div");
        el.className = "piece " + piece.c;
        el.textContent = GLYPH[piece.c][piece.t];
        cell.appendChild(el);
      }

      if (selected) {
        const mv = currentLegal.find(m =>
          m.from[0] === selected[0] && m.from[1] === selected[1] &&
          m.to[0] === br && m.to[1] === bc);
        if (mv) {
          const marker = document.createElement("div");
          marker.className = mv.captured || mv.epCapture ? "ring" : "dot";
          cell.appendChild(marker);
        }
      }

      if (vc === 0)
        cell.insertAdjacentHTML("beforeend",
          `<span class="coord rank ${(br + bc) % 2 === 0 ? "dark" : "light"}">${8 - br}</span>`);
      if (vr === 7)
        cell.insertAdjacentHTML("beforeend",
          `<span class="coord file ${(br + bc) % 2 === 0 ? "dark" : "light"}">${String.fromCharCode(97 + bc)}</span>`);

      boardEl.appendChild(cell);
    }
  }
  updateStatus();
  drawCaptured();
  renderMoves();
  updateEvalBar();
  document.getElementById("undoBtn").disabled = !history.length || !!pendingPromo || thinking;
}

/* --- move animation (FLIP over the full render() rebuild) --- */

// After render() rebuilt the board, the moved piece sits on its destination.
// We translate it back to its origin square, then transition it into place
// so each move slides instead of teleporting. Castling slides the rook too.
const MOVE_ANIM_MS = 220;

function animateMove(m) {
  if (window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const boardRect = boardEl.getBoundingClientRect();
  const sqCenter = sq => {
    const cell = boardEl.querySelector(
      `.square[data-r="${sq[0]}"][data-c="${sq[1]}"]`);
    if (!cell) return null;
    const r = cell.getBoundingClientRect();
    return { x: r.left + r.width / 2 - boardRect.left,
             y: r.top + r.height / 2 - boardRect.top };
  };
  const slide = (el, fromSq) => {
    const oldPos = sqCenter(fromSq);
    if (!oldPos) return;
    const rect = el.getBoundingClientRect();
    const now = { x: rect.left + rect.width / 2 - boardRect.left,
                  y: rect.top + rect.height / 2 - boardRect.top };
    const dx = oldPos.x - now.x, dy = oldPos.y - now.y;
    if (!dx && !dy) return;
    el.classList.add("animating");
    el.style.transition = "none";
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    void el.offsetWidth;                      // commit the start state
    el.style.transition = `transform ${MOVE_ANIM_MS}ms cubic-bezier(.25,.7,.35,1)`;
    el.style.transform = "";
    const done = () => { el.classList.remove("animating"); el.style.transition = ""; };
    el.addEventListener("transitionend", () => done(), { once: true });
    setTimeout(() => done(), MOVE_ANIM_MS + 160);   // fallback if the event is missed
  };
  const moved = boardEl.querySelector(
    `.square[data-r="${m.to[0]}"][data-c="${m.to[1]}"] > .piece`);
  if (moved) slide(moved, m.from);
  if (m.rookFrom) {
    const rookEl = boardEl.querySelector(
      `.square[data-r="${m.rookTo[0]}"][data-c="${m.rookTo[1]}"] > .piece`);
    if (rookEl) slide(rookEl, m.rookFrom);
  }
}

/* --- interaction --- */

let currentLegal = [];

boardEl.addEventListener("click", e => {
  if (gameOver || pendingPromo || thinking) return;
  const cell = e.target.closest(".square");
  if (!cell) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;

  if (selected) {
    const options = currentLegal.filter(m =>
      m.from[0] === selected[0] && m.from[1] === selected[1] &&
      m.to[0] === r && m.to[1] === c);
    if (options.length) {
      playMove(options);
      return;
    }
  }

  const piece = state.board[r][c];
  if (piece && piece.c === state.turn) {
    selected = [r, c];
    currentLegal = legalMoves(state);
  } else {
    selected = null;
    currentLegal = [];
  }
  render();
});

function playMove(options) {
  if (options.length > 1) {           // promotion
    pendingPromo = { options };
    showPromotion(options[0].color);
    return;
  }
  commit(options[0]);
}

function showPromotion(color) {
  const wrap = document.getElementById("promoChoices");
  wrap.innerHTML = "";
  for (const t of ["q", "r", "b", "n"]) {
    const d = document.createElement("div");
    d.className = color;
    d.textContent = GLYPH[color][t];
    d.onclick = () => {
      document.getElementById("promoOverlay").classList.add("hidden");
      const m = pendingPromo.options.find(x => x.promotion === t);
      pendingPromo = null;
      commit(m);
    };
    wrap.appendChild(d);
  }
  document.getElementById("promoOverlay").classList.remove("hidden");
}

function commit(m) {
  const before = state;
  const beforeLegal = currentLegal.length ? currentLegal : legalMoves(state);
  const after = makeMove(before, m);
  const san = moveToSan(before, m, after, beforeLegal);

  history.push({
    san,
    snap: {
      state: cloneState(after),
      captured: capturedSnapshot(before, m),
      move: { from: [...m.from], to: [...m.to], promo: m.promotion || null },
    },
  });

  state = after;
  selected = null;
  currentLegal = [];

  posKeys.push(posKey(after));
  evaluateGameEnd();
  playMoveSound(m, san);
  render();
  animateMove(m);
  if (gameOver) chatAfterGameEnd();
  else if (m.color !== engineColor) chatAfterHumanMove(before.board, m, san);
  if (!gameOver && engineColor && state.turn === engineColor) requestEngineMove();
}

function capturedSnapshot(before, m) {
  // what got removed compared to previous snapshot — stored implicitly;
  // simply recompute on the fly in drawCaptured(), so store nothing extra.
  return null;
}

function evaluateGameEnd() {
  const moves = legalMoves(state, state.turn);
  const checked = inCheck(state, state.turn);
  if (!moves.length) {
    gameOver = checked
      ? { result: state.turn === "w" ? "b" : "w", reason: "Checkmate" }
      : { result: "draw", reason: "Stalemate" };
  } else if (insufficientMaterial(state.board)) {
    gameOver = { result: "draw", reason: "Insufficient material" };
  } else if (state.halfmove >= 100) {
    gameOver = { result: "draw", reason: "50-move rule" };
  } else if (posKeys.filter(k => k === posKeys[posKeys.length - 1]).length >= 3) {
    gameOver = { result: "draw", reason: "Threefold repetition" };
  }
}

/* --- LLM opponent chat (OpenRouter) --- */

const CHAT_MODEL = "z-ai/glm-5.3-flash";
const CHAT_MAX_TURNS = 12;         // user/assistant pairs kept in context
const CHAT_EVAL_SWING = 150;       // centipawn swing (white perspective) that counts as "big"
const PIECE_NAME = { p: "pawn", n: "knight", b: "bishop", r: "rook", q: "queen", k: "king" };
let orKey = null;                  // session-only API key, never persisted
let chatBusy = false;
let chatAbort = null;              // AbortController of the in-flight request
let chatQueue = Promise.resolve(); // serializes requests so none are lost
let chatHistory = [];              // [{role:'user'|'assistant', content}]
let lastWhiteEval = null;          // engine eval (cp, white perspective) after its last move

const chatSetupEl = document.getElementById("chatSetup");
const chatBodyEl  = document.getElementById("chatBody");
const chatLogEl   = document.getElementById("chatLog");
const chatMetaEl  = document.getElementById("chatMeta");
const apiKeyEl    = document.getElementById("apiKeyInput");
const chatInputEl = document.getElementById("chatInput");
const chatDisableBtn = document.getElementById("chatDisableBtn");
const chatNoticeEl   = document.getElementById("chatNotice");
const chatLangEl  = document.getElementById("chatLang");

// Language preference survives reloads (the API key never does).
(function initChatLang() {
  let saved = "en";
  try { saved = localStorage.getItem("chessChatLang") || "en"; } catch (e) {}
  for (const opt of chatLangEl.options)
    if (opt.value === saved) { chatLangEl.value = saved; break; }
})();
function chatLangName() {
  return chatLangEl.options[chatLangEl.selectedIndex].text;
}
chatLangEl.addEventListener("change", () => {
  try { localStorage.setItem("chessChatLang", chatLangEl.value); } catch (e) {}
  // If the opponent is already talking, have it switch immediately.
  if (orKey)
    chatEvent(`The user switched your language to ${chatLangName()}. ` +
      `Acknowledge this very briefly, in character, in ${chatLangName()}.`);
});

function addChatBubble(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chatLogEl.appendChild(d);
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
  return d;
}

function sanMoveList() {
  let s = "";
  for (let i = 0; i < history.length; i += 2) {
    s += `${i / 2 + 1}. ${history[i].san}`;
    if (i + 1 < history.length) s += ` ${history[i + 1].san}`;
    s += "  ";
  }
  return s.trim();
}

function gameContext() {
  const caps = capturedPieces();
  const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9 };
  const mat = o => Object.entries(o).reduce((s, [t, n]) => s + VAL[t] * n, 0);
  const adv = mat(caps.byWhite) - mat(caps.byBlack);
  const myColor = engineColor === "w" ? "White" : "Black";
  let ctx = `You play ${myColor} (strength: ${LEVELS[levelIdx].name}). ` +
    `Moves so far: ${sanMoveList() || "none yet"}. ` +
    `${state.turn === "w" ? "White" : "Black"} to move` +
    `${inCheck(state, state.turn) ? " (in check)" : ""}. ` +
    `Material: ${adv > 0 ? "White +" + adv : adv < 0 ? "Black +" + (-adv) : "level"}.`;
  if (gameOver) {
    ctx += ` Game over: ${gameOver.result === "draw" ? "draw" :
      (gameOver.result === "w" ? "White" : "Black") + " wins"} by ${gameOver.reason}.`;
  }
  return ctx;
}

function systemPrompt(event) {
  return "You are the user's chess opponent in a casual online game — the moves on " +
    "your side are chosen by a chess engine, but your personality and words are yours. " +
    gameContext() + (event ? ` Recent event: ${event}` : "") +
    ` Always respond in ${chatLangName()}.` +
    " Respond in 1-3 short sentences, in character: confident, playful, light trash-talk " +
    "is welcome. Reference the actual moves or position when relevant. Never break " +
    "character, never mention being an AI or a language model, and don't give move " +
    "advice unless asked.";
}

function queueChat(userText, event) {
  chatQueue = chatQueue.then(() => doChat(userText, event));
}

async function chatRequest(msgs, maxTokens, signal) {
  // Note: glm-5.3-flash has mandatory reasoning ("cannot be disabled"),
  // so we use minimal effort + exclude, and a budget big enough to
  // leave room for content after thinking tokens.
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json",
               "Authorization": `Bearer ${orKey}` },
    body: JSON.stringify({ model: CHAT_MODEL, messages: msgs,
                           max_tokens: maxTokens, temperature: 0.8,
                           reasoning: { effort: "minimal", exclude: true } }),
    signal,
  });
  if (res.status === 401) {
    disableChat("API key rejected (401). Re-enter a valid OpenRouter key.");
    return null;
  }
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error.message || ""; } catch (e) {}
    throw new Error(`HTTP ${res.status}${detail ? " — " + detail : ""}`);
  }
  const data = await res.json();
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  return ((msg && msg.content) || "").trim();
}

async function doChat(userText, event) {
  if (!orKey) return;
  chatBusy = true;
  const aborter = chatAbort = new AbortController();
  const typing = addChatBubble("opp", "");
  typing.innerHTML = `<span class="dots"><i></i><i></i><i></i></span>`;
  try {
    const msgs = [{ role: "system", content: systemPrompt(event) },
                  ...chatHistory.slice(-CHAT_MAX_TURNS * 2),
                  { role: "user", content: userText || `[game event] ${event}` }];
    let reply = await chatRequest(msgs, 1024, aborter.signal);
    if (reply === null) { typing.remove(); return; }   // 401, chat disabled
    if (!reply)          // empty: retry once with a bigger budget
      reply = await chatRequest(msgs, 2048, aborter.signal);
    typing.remove();
    if (!reply) return;  // still empty: drop silently
    addChatBubble("opp", reply);
    chatHistory.push({ role: "user", content: userText || `[game event] ${event}` },
                     { role: "assistant", content: reply });
    if (chatHistory.length > CHAT_MAX_TURNS * 2)
      chatHistory = chatHistory.slice(-CHAT_MAX_TURNS * 2);
  } catch (err) {
    typing.remove();
    if (err.name !== "AbortError")   // aborted = user interrupted; stay silent
      addChatBubble("sys", `Chat error: ${err.message}`);
  } finally {
    chatBusy = false;
    if (chatAbort === aborter) chatAbort = null;
  }
}

function disableChat(reason) {
  if (chatAbort) chatAbort.abort();   // stop any reply being generated
  orKey = null;
  chatHistory = [];
  chatBodyEl.classList.add("hidden");
  chatSetupEl.classList.remove("hidden");
  chatDisableBtn.classList.add("hidden");
  chatMetaEl.textContent = "";
  chatNoticeEl.textContent = reason || "";
}

// User messages take precedence: abort any reply being generated, then
// send (queued, so rapid successive messages are all delivered).
function userSay(text) {
  if (!orKey) return;
  addChatBubble("you", text);
  if (chatBusy && chatAbort) chatAbort.abort();
  queueChat(text, null);
}

// Event hooks — all no-ops unless chat is enabled and idle.
function chatEvent(event) {
  if (orKey && !chatBusy) queueChat(null, event);
}

// The opponent only speaks up about significant events; quiet moves stay quiet.
function describeMoveEvents(beforeBoard, m, san, who) {
  const events = [];
  const capSq = m.epCapture || m.to;
  const cap = beforeBoard[capSq[0]][capSq[1]];
  if (cap) events.push(`${who} captured a ${PIECE_NAME[cap.t]} (${san})`);
  if (m.promotion) events.push(`${who} promoted a pawn to a ${PIECE_NAME[m.promotion]} (${san})`);
  if (san.endsWith("+")) events.push(`${who} gave check (${san})`);
  return events;
}

function chatAfterHumanMove(beforeBoard, m, san) {
  if (!orKey || chatBusy || gameOver) return;
  const events = describeMoveEvents(beforeBoard, m, san, "Your opponent (the human)");
  if (events.length) chatEvent(events.join(". ") + ". React to it in character.");
}

function chatAfterEngineMove(beforeBoard, m, san, swing, whiteEval) {
  if (!orKey || chatBusy || gameOver) return;
  const events = describeMoveEvents(beforeBoard, m, san, "You");
  if (Math.abs(swing) >= CHAT_EVAL_SWING)
    events.push(`the evaluation swung ${(Math.abs(swing) / 100).toFixed(1)} pawns in ` +
                `${swing > 0 ? "White" : "Black"}'s favor (now ${fmtScore(whiteEval)})`);
  if (events.length) chatEvent(events.join(". ") + ". React to it in character.");
}

function chatAfterGameEnd() {
  if (!orKey || chatBusy) return;
  const res = gameOver.result === "draw" ? "a draw"
    : (gameOver.result === engineColor ? "your victory" : "your loss");
  chatEvent(`The game just ended: ${res} by ${gameOver.reason}. React in character (graceful or salty).`);
}

function chatReset() {
  chatHistory = [];
  lastWhiteEval = null;
  chatLogEl.innerHTML = "";
}

document.getElementById("chatEnableBtn").onclick = () => {
  const key = apiKeyEl.value.trim();
  if (!key.startsWith("sk-")) {
    chatNoticeEl.textContent =
      "That doesn't look like an OpenRouter key (should start with sk-).";
    return;
  }
  orKey = key;
  apiKeyEl.value = "";
  chatNoticeEl.textContent = "";
  chatSetupEl.classList.add("hidden");
  chatBodyEl.classList.remove("hidden");
  chatDisableBtn.classList.remove("hidden");
  chatMetaEl.textContent = CHAT_MODEL.split("/")[1];
  chatReset();
  queueChat(null, "The game is starting. Greet your opponent in character.");
};

chatDisableBtn.onclick = () => disableChat("Chat disabled.");

chatInputEl.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const t = chatInputEl.value.trim();
  if (!t) return;
  chatInputEl.value = "";
  userSay(t);
});
document.getElementById("chatSendBtn").onclick = () => {
  const t = chatInputEl.value.trim();
  if (!t) return;
  chatInputEl.value = "";
  userSay(t);
};

/* --- sound effects (WebAudio, synthesized — no assets) --- */

let audioCtx = null;
let soundOn = true;
try { soundOn = localStorage.getItem("chessSound") !== "off"; } catch (e) {}

function ensureAudio() {
  if (!soundOn) return null;
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// Browsers block audio until a user gesture; unlock the context on the
// first click/tap anywhere (engine moves have no gesture of their own).
window.addEventListener("pointerdown", () => { if (soundOn) ensureAudio(); }, { once: true });

function tone(freq, dur, opts = {}) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + (opts.at || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = opts.type || "sine";
  osc.frequency.setValueAtTime(freq, t0);
  if (opts.slide) osc.frequency.exponentialRampToValueAtTime(opts.slide, t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(opts.vol || 0.12, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

// "Soft Minimal" pack — gentle sine pings only: quiet and unobtrusive.
const SFX = {
  move()    { tone(320, 0.06, { vol: 0.08 }); },
  capture() { tone(220, 0.10, { vol: 0.10, slide: 140 }); },
  castle()  { tone(300, 0.05, { vol: 0.07 }); tone(380, 0.07, { vol: 0.08, at: 0.07 }); },
  check()   { tone(740, 0.14, { vol: 0.09 }); tone(988, 0.20, { vol: 0.08, at: 0.13 }); },
  promote() { [660, 830, 990].forEach((f, i) => tone(f, 0.14, { vol: 0.08, at: i * 0.09 })); },
  win()     { [660, 830, 990, 1320].forEach((f, i) => tone(f, 0.22, { vol: 0.09, at: i * 0.13 })); },
  lose()    { [520, 440, 370].forEach((f, i) => tone(f, 0.30, { vol: 0.08, at: i * 0.17 })); },
  draw()    { tone(494, 0.18, { vol: 0.07 }); tone(440, 0.24, { vol: 0.06, at: 0.20 }); },
};

// Called from commit() after evaluateGameEnd(), so gameOver is current.
function playMoveSound(m, san) {
  if (gameOver) {
    if (gameOver.result === "draw") SFX.draw();
    else SFX[gameOver.result === engineColor ? "lose" : "win"]();
    return;
  }
  if (m.promotion) SFX.promote();
  else if (m.rookFrom) SFX.castle();
  else if (m.captured || m.epCapture) SFX.capture();
  else SFX.move();
  if (san.endsWith("+")) SFX.check();
}

/* --- buttons --- */

document.getElementById("newBtn").onclick = () => {
  if (thinking) stopEngine();
  state = initialState();
  history = [];
  posKeys = [posKey()];
  selected = null;
  currentLegal = [];
  gameOver = null;
  pendingPromo = null;
  evalWhiteCp = 0;
  resetEngineStats();
  chatReset();
  render();
  if (engineColor && state.turn === engineColor) requestEngineMove();
};

document.getElementById("undoBtn").onclick = () => {
  if (!history.length || pendingPromo || thinking) return;
  const n = (engineColor && state.turn !== engineColor) ? 2 : 1;
  for (let i = 0; i < n && history.length; i++) { history.pop(); posKeys.pop(); }
  state = history.length
    ? cloneState(history[history.length - 1].snap.state)
    : initialState();
  selected = null;
  currentLegal = [];
  gameOver = null;
  resetEngineStats();
  render();
  if (engineColor && !gameOver && state.turn === engineColor) requestEngineMove();
};

document.getElementById("flipBtn").onclick = () => {
  flipped = !flipped;
  render();
};

const soundBtn = document.getElementById("soundBtn");
// Feather-style monochrome icons; use currentColor so they inherit the
// button's text color and stay crisp at any size (no emoji color clash).
const SOUND_ON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
const SOUND_OFF_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="17" y2="14"/><line x1="17" y1="9" x2="22" y2="14"/></svg>';
function drawSoundIcon() {
  soundBtn.innerHTML = soundOn ? SOUND_ON_SVG : SOUND_OFF_SVG;
  soundBtn.title = soundOn ? "Sound on (click to mute)" : "Sound off (click to unmute)";
  soundBtn.setAttribute("aria-label", soundBtn.title);
}
drawSoundIcon();
soundBtn.onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem("chessSound", soundOn ? "on" : "off"); } catch (e) {}
  drawSoundIcon();
  if (soundOn) SFX.move();   // audible confirmation it's back on
};

document.getElementById("modeRow").addEventListener("click", e => {
  const btn = e.target.closest(".mode-btn");
  if (!btn) return;
  const newColor = btn.dataset.mode;
  if (newColor === engineColor) return;
  if (thinking) stopEngine();
  engineColor = newColor;
  resetEngineStats();
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
  strengthRow.classList.toggle("visible", !!engineColor);
  if (engineColor && !gameOver && state.turn === engineColor) requestEngineMove();
  else render();
});

/* --- engine strength: radio buttons --- */
const LEVELS = [
  { name: "Newbie",  thinkMs: 200, maxDepth: 2, noise: 150 },
  { name: "Okayish", thinkMs: 800, maxDepth: 5, noise: 20 },
  { name: "Boss",    thinkMs: 2000, maxDepth: 99, noise: 0 },
];
let levelIdx = 2;
const strengthRow = document.getElementById("strengthRow");
const strengthRadios = [
  document.getElementById("strengthNewbie"),
  document.getElementById("strengthOkayish"),
  document.getElementById("strengthBoss"),
];
(function initStrength() {
  let saved = 2;
  try {
    const v = localStorage.getItem("chessStrength");
    if (v !== null) saved = Math.min(2, Math.max(0, +v || 0));
  } catch (e) {}
  levelIdx = saved;
  strengthRadios[levelIdx].checked = true;
  strengthRow.classList.toggle("visible", !!engineColor);
})();
strengthRadios.forEach((radio, i) => {
  radio.addEventListener("change", () => {
    if (!radio.checked) return;
    levelIdx = i;
    try { localStorage.setItem("chessStrength", String(levelIdx)); } catch (e) {}
    updateSetupMeta();
    if (thinking) { stopEngine(); requestEngineMove(); }
  });
});

/* --- resizable board --- */
const boardOuter = document.getElementById("boardOuter");
const resizeHandle = document.getElementById("resizeHandle");
const RSZ_MIN = 240;

function boardMaxWidth() {
  return Math.max(RSZ_MIN, Math.min(window.innerWidth - 32, window.innerHeight - 48));
}
function saveBoardSize(w) {
  try { localStorage.setItem("chessBoardSize", String(Math.round(w))); } catch (e) {}
}
(function initBoardSize() {
  let saved = 0;
  try { saved = +localStorage.getItem("chessBoardSize") || 0; } catch (e) {}
  if (saved >= RSZ_MIN) boardOuter.style.width = Math.min(saved, boardMaxWidth()) + "px";
})();
if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(entries => {
    for (const en of entries)
      boardOuter.style.setProperty("--sq", (en.contentRect.width / 8) + "px");
  }).observe(boardEl);
}
let rszDrag = null;
resizeHandle.addEventListener("pointerdown", e => {
  e.preventDefault();
  rszDrag = { startX: e.clientX, startW: boardOuter.getBoundingClientRect().width };
  try { resizeHandle.setPointerCapture(e.pointerId); } catch (err) {}
});
resizeHandle.addEventListener("pointermove", e => {
  if (!rszDrag) return;
  const w = Math.max(RSZ_MIN, Math.min(boardMaxWidth(), rszDrag.startW + (e.clientX - rszDrag.startX)));
  boardOuter.style.width = w + "px";
  saveBoardSize(w);
});
const rszEnd = () => { rszDrag = null; };
resizeHandle.addEventListener("pointerup", rszEnd);
resizeHandle.addEventListener("pointercancel", rszEnd);
window.addEventListener("resize", () => {
  const cur = boardOuter.getBoundingClientRect().width;
  const max = boardMaxWidth();
  if (cur > max) boardOuter.style.width = max + "px";
});

render();
</script>
